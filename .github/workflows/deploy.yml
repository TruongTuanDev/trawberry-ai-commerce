name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify-ci:
    name: Verify CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow success on this commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.sha;
            const workflowId = 'ci.yml';
            const maxAttempts = 60;
            const delayMs = 30000;

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                head_sha: headSha,
                per_page: 10,
              });

              const run = response.data.workflow_runs.find((item) => item.head_sha === headSha);

              if (run) {
                core.info(`CI workflow status for ${headSha}: ${run.status}/${run.conclusion ?? 'pending'} (attempt ${attempt}/${maxAttempts})`);
                if (run.status === 'completed') {
                  if (run.conclusion === 'success') {
                    return;
                  }

                  core.setFailed(`CI workflow concluded with '${run.conclusion}' for ${headSha}. Deployment is blocked.`);
                  return;
                }
              } else {
                core.info(`No CI workflow run found yet for ${headSha} (attempt ${attempt}/${maxAttempts}).`);
              }

              if (attempt < maxAttempts) {
                await sleep(delayMs);
              }
            }

            core.setFailed(`Timed out waiting for CI workflow success on ${headSha}.`);

  build-and-push:
    name: Build And Push Images
    runs-on: ubuntu-latest
    needs:
      - verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: backend-nest
            context: ./backend-nest
            file: ./backend-nest/Dockerfile
            build_args: ""
          - image_name: frontend-next
            context: ./frontend-next
            file: ./frontend-next/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=${{ vars.DEPLOY_NEXT_PUBLIC_API_URL || 'https://api.yourdomain.ru' }}
          - image_name: ai-service
            context: ./ai-service
            file: ./ai-service/Dockerfile
            build_args: ""
          - image_name: nginx
            context: ./infra/nginx
            file: ./infra/nginx/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Compute image namespace
        id: vars
        shell: bash
        run: |
          image_namespace="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image_namespace=$image_namespace" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_namespace }}/${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_namespace }}/${{ matrix.image_name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_namespace }}/${{ matrix.image_name }}:latest
          build-args: ${{ matrix.build_args }}

      - name: Verify pushed image tag
        shell: bash
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_namespace }}/${{ matrix.image_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_NAME:${GITHUB_SHA}" >/dev/null

  deploy-vps:
    name: Deploy VPS
    runs-on: ubuntu-latest
    needs:
      - verify-ci
      - build-and-push
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Compute image namespace
        id: vars
        shell: bash
        run: |
          image_namespace="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image_namespace=$image_namespace" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH key
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Prepare known_hosts
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS || '' }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" > "$HOME/.ssh/known_hosts"
          fi
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Upload deploy bundle
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          tar -czf - infra | ssh -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes \
            "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$VPS_APP_DIR' && tar -xzf - -C '$VPS_APP_DIR' && chmod +x '$VPS_APP_DIR/infra/scripts/'*.sh"

      - name: Deploy over SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
          FRONTEND_IMAGE: ghcr.io/${{ steps.vars.outputs.image_namespace }}/frontend-next:${{ github.sha }}
          BACKEND_IMAGE: ghcr.io/${{ steps.vars.outputs.image_namespace }}/backend-nest:${{ github.sha }}
          AI_SERVICE_IMAGE: ghcr.io/${{ steps.vars.outputs.image_namespace }}/ai-service:${{ github.sha }}
          NGINX_IMAGE: ghcr.io/${{ steps.vars.outputs.image_namespace }}/nginx:${{ github.sha }}
        run: |
          set -euo pipefail
          remote_script="$(mktemp)"
          trap 'rm -f "$remote_script"' EXIT
          cat > "$remote_script" <<'EOF'
          set -euo pipefail

          cd "$VPS_APP_DIR"

          test -f infra/.env.production

          cat > infra/.env.deploy <<DEPLOY_ENV
          FRONTEND_IMAGE=$FRONTEND_IMAGE
          BACKEND_IMAGE=$BACKEND_IMAGE
          AI_SERVICE_IMAGE=$AI_SERVICE_IMAGE
          NGINX_IMAGE=$NGINX_IMAGE
          DEPLOY_SHA=$DEPLOY_SHA
          DEPLOY_ENV

          dump_deploy_diagnostics() {
            code=$?
            set +e
            echo "Deployment failed with exit code $code. Container status:"
            docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.production --env-file infra/.env.deploy ps -a
            echo "Backend/PostgreSQL/AI logs:"
            docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.production --env-file infra/.env.deploy logs --no-color --tail=250 backend-nest postgres ai-service
            exit "$code"
          }
          trap dump_deploy_diagnostics ERR

          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.production --env-file infra/.env.deploy pull nginx backend-nest frontend-next ai-service
          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.production --env-file infra/.env.deploy up -d
          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.production --env-file infra/.env.deploy ps

          ./infra/scripts/smoke-production.sh infra/.env.production
          EOF

          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$VPS_PORT"
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
            -o TCPKeepAlive=yes
          )
          remote="$VPS_USER@$VPS_HOST"

          for attempt in 1 2 3; do
            if ssh "${ssh_opts[@]}" "$remote" \
              "cat > '$VPS_APP_DIR/infra/.deploy-remote.sh'" < "$remote_script"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Could not upload the remote deploy script after 3 attempts."
              exit 1
            fi
            sleep 10
          done

          ssh "${ssh_opts[@]}" "$remote" \
            "set -e; echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin >/dev/null 2>&1; rm -f '$VPS_APP_DIR/infra/.deploy.status'; nohup env VPS_APP_DIR='$VPS_APP_DIR' GHCR_USERNAME='$GHCR_USERNAME' FRONTEND_IMAGE='$FRONTEND_IMAGE' BACKEND_IMAGE='$BACKEND_IMAGE' AI_SERVICE_IMAGE='$AI_SERVICE_IMAGE' NGINX_IMAGE='$NGINX_IMAGE' DEPLOY_SHA='$DEPLOY_SHA' bash -c 'bash \"$VPS_APP_DIR/infra/.deploy-remote.sh\"; code=\$?; printf \"%s\\n\" \"\$code\" > \"$VPS_APP_DIR/infra/.deploy.status\"' > '$VPS_APP_DIR/infra/.deploy.log' 2>&1 < /dev/null & echo 'Remote deploy started.'"

          for poll in $(seq 1 80); do
            status="$(ssh "${ssh_opts[@]}" "$remote" \
              "if test -f '$VPS_APP_DIR/infra/.deploy.status'; then cat '$VPS_APP_DIR/infra/.deploy.status'; else printf running; fi" \
              2>/dev/null || printf disconnected)"
            echo "Remote deploy poll $poll/80: $status"
            if [ "$status" = "0" ]; then
              ssh "${ssh_opts[@]}" "$remote" "tail -n 120 '$VPS_APP_DIR/infra/.deploy.log'"
              exit 0
            fi
            if [ "$status" != "running" ] && [ "$status" != "disconnected" ]; then
              ssh "${ssh_opts[@]}" "$remote" "tail -n 200 '$VPS_APP_DIR/infra/.deploy.log'" || true
              exit 1
            fi
            sleep 30
          done

          echo "Remote deploy did not finish within 40 minutes."
          ssh "${ssh_opts[@]}" "$remote" "tail -n 200 '$VPS_APP_DIR/infra/.deploy.log'" || true
          exit 1
