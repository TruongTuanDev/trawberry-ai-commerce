name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify-ci:
    name: Verify CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow success on this commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.sha;
            const workflowId = 'ci.yml';
            const maxAttempts = 60;
            const delayMs = 30000;

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                head_sha: headSha,
                per_page: 10,
              });

              const run = response.data.workflow_runs.find((item) => item.head_sha === headSha);

              if (run) {
                core.info(`CI workflow status for ${headSha}: ${run.status}/${run.conclusion ?? 'pending'} (attempt ${attempt}/${maxAttempts})`);
                if (run.status === 'completed') {
                  if (run.conclusion === 'success') {
                    return;
                  }

                  core.setFailed(`CI workflow concluded with '${run.conclusion}' for ${headSha}. Deployment is blocked.`);
                  return;
                }
              } else {
                core.info(`No CI workflow run found yet for ${headSha} (attempt ${attempt}/${maxAttempts}).`);
              }

              if (attempt < maxAttempts) {
                await sleep(delayMs);
              }
            }

            core.setFailed(`Timed out waiting for CI workflow success on ${headSha}.`);

  build-and-push:
    name: Build And Push Images
    runs-on: ubuntu-latest
    needs:
      - verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: backend-nest
            context: ./backend-nest
            file: ./backend-nest/Dockerfile
            build_args: ""
          - image_name: frontend-next
            context: ./frontend-next
            file: ./frontend-next/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=${{ vars.DEPLOY_NEXT_PUBLIC_API_URL || 'https://api.yourdomain.ru' }}
          - image_name: ai-service
            context: ./ai-service
            file: ./ai-service/Dockerfile
            build_args: ""
          - image_name: nginx
            context: ./infra/nginx
            file: ./infra/nginx/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Compute image namespace
        id: vars
        shell: bash
        run: |
          image_namespace="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image_namespace=$image_namespace" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_namespace }}/${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_namespace }}/${{ matrix.image_name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_namespace }}/${{ matrix.image_name }}:latest
          build-args: ${{ matrix.build_args }}

      - name: Verify pushed image tag
        shell: bash
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_namespace }}/${{ matrix.image_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_NAME:${GITHUB_SHA}" >/dev/null

  deploy-vps:
    name: Deploy VPS
    runs-on: ubuntu-latest
    needs:
      - verify-ci
      - build-and-push
    environment:
      name: production
    steps:
      - name: Compute image namespace
        id: vars
        shell: bash
        run: |
          image_namespace="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image_namespace=$image_namespace" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH key
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Prepare known_hosts
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS || '' }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" > "$HOME/.ssh/known_hosts"
          fi
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy over SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
          FRONTEND_IMAGE: ghcr.io/${{ steps.vars.outputs.image_namespace }}/frontend-next:${{ github.sha }}
          BACKEND_IMAGE: ghcr.io/${{ steps.vars.outputs.image_namespace }}/backend-nest:${{ github.sha }}
          AI_SERVICE_IMAGE: ghcr.io/${{ steps.vars.outputs.image_namespace }}/ai-service:${{ github.sha }}
          NGINX_IMAGE: ghcr.io/${{ steps.vars.outputs.image_namespace }}/nginx:${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "VPS_APP_DIR='$VPS_APP_DIR' GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' FRONTEND_IMAGE='$FRONTEND_IMAGE' BACKEND_IMAGE='$BACKEND_IMAGE' AI_SERVICE_IMAGE='$AI_SERVICE_IMAGE' NGINX_IMAGE='$NGINX_IMAGE' DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'EOF'
          set -euo pipefail

          cd "$VPS_APP_DIR"

          test -f infra/.env.production

          git fetch origin main
          git reset --hard origin/main

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin >/dev/null 2>&1

          docker pull "$FRONTEND_IMAGE"
          docker pull "$BACKEND_IMAGE"
          docker pull "$AI_SERVICE_IMAGE"
          docker pull "$NGINX_IMAGE"

          cat > infra/.env.deploy <<DEPLOY_ENV
          FRONTEND_IMAGE=$FRONTEND_IMAGE
          BACKEND_IMAGE=$BACKEND_IMAGE
          AI_SERVICE_IMAGE=$AI_SERVICE_IMAGE
          NGINX_IMAGE=$NGINX_IMAGE
          DEPLOY_SHA=$DEPLOY_SHA
          DEPLOY_ENV

          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.production --env-file infra/.env.deploy pull nginx backend-nest frontend-next ai-service
          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.production --env-file infra/.env.deploy up -d
          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.production --env-file infra/.env.deploy ps

          ./infra/scripts/smoke-production.sh infra/.env.production
          EOF
