name: CI

on:
  push:
    branches:
      - main
      - "frontend/**"
      - "backend/**"
      - "integration/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-safety:
    name: Repository Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked real .env files
        shell: bash
        run: |
          set -euo pipefail
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env$' || true)"
          if [ -n "$tracked_env_files" ]; then
            echo "Tracked .env files are not allowed:"
            echo "$tracked_env_files"
            exit 1
          fi

      - name: Reject tracked data.xlsx
        shell: bash
        run: |
          set -euo pipefail
          tracked_data_file="$(git ls-files data.xlsx || true)"
          if [ -n "$tracked_data_file" ]; then
            echo "Tracked data.xlsx is not allowed:"
            echo "$tracked_data_file"
            exit 1
          fi

      - name: Reject tracked Playwright and test artifacts
        shell: bash
        run: |
          set -euo pipefail
          tracked_artifacts="$(git ls-files | grep -E '(^|/)(playwright-report|test-results|screenshots|videos)(/|$)' || true)"
          if [ -n "$tracked_artifacts" ]; then
            echo "Tracked test artifacts are not allowed:"
            echo "$tracked_artifacts"
            exit 1
          fi

  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: strawberry_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d strawberry_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend-nest

    env:
      APP_ENV: test
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/strawberry_ci?schema=public
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      JWT_SECRET: ci-legacy-secret
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BULLMQ_DISABLED: "true"
      WB_SYNC_MODE: mock
      DELIVERY_PROVIDER_MODE: mock
      AI_WORKER_MODE: internal-mock
      AI_SERVICE_BASE_URL: http://127.0.0.1:8000
      AI_SERVICE_INTERNAL_TOKEN: ci-internal-token
      FILE_STORAGE_DRIVER: local
      STORAGE_DRIVER: local
      UPLOAD_ROOT: uploads-ci
      FILES_PUBLIC_BASE_URL: http://127.0.0.1:3001
      WB_CREDENTIAL_ENCRYPTION_KEY: ci-wb-credential-key-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-nest/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Enable PostgreSQL extensions
        shell: bash
        run: |
          PSQL_DATABASE_URL="${DATABASE_URL%%\?*}"
          psql "$PSQL_DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - run: npx prisma db push
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: backend

    defaults:
      run:
        working-directory: frontend-next

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
      RUN_OPENAI_SMOKE: "false"
      AI_IMAGE_PROVIDER: mock
      STORAGE_DRIVER: mock
      WB_CREDENTIAL_ENCRYPTION_KEY: ci-wb-credential-key-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: backend-nest
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend-next
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend-next
        run: npx playwright install --with-deps chromium

      - name: Start stack
        run: docker compose -f infra/docker-compose.yml up -d --build postgres redis backend-nest frontend-next ai-service

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            curl -f http://127.0.0.1:3001/api/health && exit 0
            sleep 2
          done
          exit 1

      - name: Prepare database for E2E
        run: docker compose -f infra/docker-compose.yml exec -T backend-nest npx prisma db push

      - name: Seed demo accounts for E2E
        run: docker compose -f infra/docker-compose.yml exec -T -e DEMO_SEED_CONFIRM=true backend-nest npm run seed:demo

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            curl -f -I http://127.0.0.1:3000/products && exit 0
            sleep 2
          done
          exit 1

      - name: Run public/customer E2E
        working-directory: frontend-next
        run: |
          npx playwright test tests/e2e/i18n-public-customer.spec.ts --workers=1
          npx playwright test tests/e2e/i18n-role-locale.spec.ts --workers=1
          npx playwright test tests/e2e/public-marketplace-contract.spec.ts --workers=1
          npx playwright test tests/e2e/product-buying-ux.spec.ts --workers=1
          npx playwright test tests/e2e/cart-checkout.spec.ts --workers=1
          npx playwright test tests/e2e/yandex-address-readiness.spec.ts --workers=1
          npx playwright test tests/e2e/yandex-address-flow.spec.ts --workers=1
          npx playwright test tests/e2e/customer-order-history.spec.ts --workers=1
          npx playwright test tests/e2e/action-feedback.spec.ts --workers=1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend-next/playwright-report
