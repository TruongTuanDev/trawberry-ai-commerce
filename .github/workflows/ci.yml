name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-safety:
    name: Repository Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked real .env files
        shell: bash
        run: |
          set -euo pipefail
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env$' || true)"
          if [ -n "$tracked_env_files" ]; then
            echo "Tracked .env files are not allowed:"
            echo "$tracked_env_files"
            exit 1
          fi

      - name: Reject tracked data.xlsx
        shell: bash
        run: |
          set -euo pipefail
          tracked_data_file="$(git ls-files data.xlsx || true)"
          if [ -n "$tracked_data_file" ]; then
            echo "Tracked data.xlsx is not allowed:"
            echo "$tracked_data_file"
            exit 1
          fi

      - name: Reject tracked Playwright and test artifacts
        shell: bash
        run: |
          set -euo pipefail
          tracked_artifacts="$(git ls-files | grep -E '(^|/)(playwright-report|test-results|screenshots|videos)(/|$)' || true)"
          if [ -n "$tracked_artifacts" ]; then
            echo "Tracked test artifacts are not allowed:"
            echo "$tracked_artifacts"
            exit 1
          fi

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs:
      - repository-safety
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: strawberry_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d strawberry_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-nest
    env:
      APP_ENV: test
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/strawberry_ci?schema=public
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      JWT_SECRET: ci-legacy-secret
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BULLMQ_DISABLED: "true"
      FILE_STORAGE_DRIVER: local
      STORAGE_DRIVER: local
      UPLOAD_ROOT: uploads-ci
      FILES_PUBLIC_BASE_URL: http://127.0.0.1:3001
      AI_WORKER_MODE: internal-mock
      AI_SERVICE_BASE_URL: http://127.0.0.1:8010
      AI_SERVICE_INTERNAL_TOKEN: ci-internal-token
      AI_IMAGE_PROVIDER: mock
      AI_TRY_ON_PROVIDER: demo
      AI_TRY_ON_ENABLED: "false"
      OPENAI_API_KEY: ""
      RUN_OPENAI_SMOKE: "false"
      WB_SYNC_MODE: mock
      DELIVERY_PROVIDER_MODE: mock
      CDEK_DELIVERY_ENABLED: "false"
      YANDEX_DELIVERY_ENABLED: "false"
      WB_CREDENTIAL_ENCRYPTION_KEY: ci-wb-credential-key-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-nest/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Enable uuid-ossp extension
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d strawberry_ci -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Push Prisma schema
        run: npx prisma db push

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: AI Try-On targeted test
        run: npm test -- --runInBand test/ai-try-on.e2e-spec.ts

      - name: Product targeted test
        run: npm test -- --runInBand test/product.e2e-spec.ts

      - name: Orders targeted test
        run: npm test -- --runInBand test/orders.e2e-spec.ts

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs:
      - repository-safety
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install dependencies
        working-directory: frontend-next
        run: npm ci

      - name: Lint
        working-directory: frontend-next
        run: npm run lint

      - name: Build
        working-directory: frontend-next
        run: npm run build

  ai-service:
    name: AI Service
    runs-on: ubuntu-latest
    needs:
      - repository-safety
    defaults:
      run:
        working-directory: ai-service
    env:
      ENVIRONMENT: test
      AI_IMAGE_PROVIDER: mock
      AI_TRY_ON_PROVIDER: demo
      OPENAI_API_KEY: ""
      RUN_OPENAI_SMOKE: "false"
      STORAGE_DRIVER: mock
      STORAGE_LOCAL_ROOT: generated-test
      STORAGE_PUBLIC_BASE_URL: http://testserver/generated
      S3_ENDPOINT: ""
      S3_ENDPOINT_URL: ""
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      S3_PUBLIC_BASE_URL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile app
        run: python -m compileall app

      - name: Run tests
        run: python -m pytest -q

  docker-config:
    name: Docker Config
    runs-on: ubuntu-latest
    needs:
      - repository-safety
    steps:
      - uses: actions/checkout@v4

      - name: Validate local compose config
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env.example config

      - name: Validate production compose config
        run: docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.example config

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - frontend
      - ai-service
      - docker-config
    steps:
      - uses: actions/checkout@v4

      - name: Build production images
        run: docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.example build backend-nest frontend-next ai-service nginx
