name: CI

on:
  push:
    branches:
      - main
      - "frontend/**"
      - "backend/**"
      - "integration/**"
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: strawberry_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d strawberry_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend-nest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/strawberry_ci?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_SECRET: ci-legacy-secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      BULLMQ_DISABLED: "true"
      WB_SYNC_MODE: mock
      DELIVERY_PROVIDER_MODE: mock
      AI_WORKER_MODE: internal-mock
      AI_SERVICE_BASE_URL: http://127.0.0.1:8000
      AI_SERVICE_INTERNAL_TOKEN: ci-internal-token
      FILE_STORAGE_DRIVER: local
      STORAGE_DRIVER: local
      UPLOAD_ROOT: uploads-ci
      FILES_PUBLIC_BASE_URL: http://127.0.0.1:3001
      WB_CREDENTIAL_ENCRYPTION_KEY: ci-wb-credential-key-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-nest/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    needs: backend

    defaults:
      run:
        working-directory: frontend-next

    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
      RUN_OPENAI_SMOKE: "false"
      AI_IMAGE_PROVIDER: mock
      STORAGE_DRIVER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: backend-nest
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend-next
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend-next
        run: npx playwright install --with-deps chromium

      - name: Start stack
        run: docker compose -f infra/docker-compose.yml up -d --build postgres redis backend-nest frontend-next ai-service

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            curl -f http://127.0.0.1:3001/api/health && exit 0
            sleep 2
          done
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            curl -f -I http://127.0.0.1:3000/products && exit 0
            sleep 2
          done
          exit 1

      - name: Run public/customer E2E
        working-directory: frontend-next
        run: |
          npx playwright test tests/e2e/i18n-public-customer.spec.ts --workers=1
          npx playwright test tests/e2e/i18n-role-locale.spec.ts --workers=1
          npx playwright test tests/e2e/public-marketplace-contract.spec.ts --workers=1
          npx playwright test tests/e2e/product-buying-ux.spec.ts --workers=1
          npx playwright test tests/e2e/cart-checkout.spec.ts --workers=1
          npx playwright test tests/e2e/yandex-address-readiness.spec.ts --workers=1
          npx playwright test tests/e2e/yandex-address-flow.spec.ts --workers=1
          npx playwright test tests/e2e/customer-order-history.spec.ts --workers=1
          npx playwright test tests/e2e/action-feedback.spec.ts --workers=1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend-next/playwright-report
