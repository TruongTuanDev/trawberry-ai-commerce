  <path class="dash" d="M1070 585 L365 550" marker-end="url(#arrow)"/>
  <text x="640" y="560" class="rel">«include»</text>

  <!-- flow relations -->
  <path class="dash" d="M720 458 L720 524" marker-end="url(#arrow)"/>
  <text x="736" y="495" class="rel">«include»</text>

  <path class="dash" d="M730 596 L726 651" marker-end="url(#arrow)"/>
  <text x="744" y="630" class="rel">«include»</text>

  <path class="dash" d="M356 328 L568 290" marker-end="url(#arrow)"/>
  <text x="450" y="292" class="rel">«extend»</text>

  <path class="dash" d="M362 430 L548 420" marker-end="url(#arrow)"/>
  <text x="442" y="408" class="rel">«extend»</text>

  <path class="dash" d="M359 540 L548 430" marker-end="url(#arrow)"/>
  <text x="430" y="476" class="rel">«extend»</text>

  <path class="dash" d="M1120 785 L850 822" marker-end="url(#arrow)"/>
  <text x="982" y="792" class="rel">«extend»</text>
</svg>
