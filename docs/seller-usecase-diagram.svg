  <text x="960" y="472" class="rel">«include»</text>
  <path class="dash" d="M790 885 L1090 196" marker-end="url(#arrow)"/>
  <text x="986" y="540" class="rel">«include»</text>
  <path class="dash" d="M785 1010 L1100 202" marker-end="url(#arrow)"/>
  <text x="992" y="612" class="rel">«include»</text>

  <!-- right-side includes -->
  <path class="dash" d="M1025 150 L1020 150" marker-end="url(#arrow)"/>
  <path class="dash" d="M1010 245 L1015 180" marker-end="url(#arrow)"/>
  <text x="1010" y="215" class="rel">«include»</text>

  <!-- extend/include detailed relations -->
  <path class="dash" d="M975 360 L790 500" marker-end="url(#arrow)"/>
  <text x="870" y="408" class="rel">«extend»</text>

  <path class="dash" d="M960 490 L780 505" marker-end="url(#arrow)"/>
  <text x="858" y="482" class="rel">«extend»</text>

  <path class="dash" d="M975 620 L780 755" marker-end="url(#arrow)"/>
  <text x="868" y="690" class="rel">«include»</text>

  <path class="dash" d="M960 760 L790 760" marker-end="url(#arrow)"/>
  <text x="860" y="748" class="rel">«include»</text>

  <path class="dash" d="M945 890 L798 885" marker-end="url(#arrow)"/>
  <text x="860" y="874" class="rel">«extend»</text>

  <path class="dash" d="M970 1010 L790 1010" marker-end="url(#arrow)"/>
  <text x="875" y="995" class="rel">«include»</text>
</svg>
